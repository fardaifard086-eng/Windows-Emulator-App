<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0078D7">
    <title>Windows-Emulator OS</title>
    <style>
        :root {
            --bg: #0f0f13; --text: #ffffff; --glass-bg: rgba(30, 30, 40, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15); --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.15); --accent: #0078D7;
        }
        body.light-mode {
            --bg: #e0e5ec; --text: #000000; --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.1); --btn-bg: rgba(0, 0, 0, 0.05); --btn-hover: rgba(0, 0, 0, 0.1);
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; padding: 0; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(circle at 10% 20%, rgba(0,120,215,0.1) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(76,175,80,0.1) 0%, transparent 40%);
            background-size: 200% 200%; animation: bgAnim 10s ease infinite;
        }
        @keyframes bgAnim { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .taskbar { background: var(--glass-bg); backdrop-filter: blur(15px); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); font-size: 14px; z-index: 100; }
        .taskbar-left { font-weight: bold; color: #4CAF50; font-size: 16px; }
        .desktop { flex: 1; position: relative; padding: 20px; display: flex; justify-content: center; align-items: center; }
        
        .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; width: 100%; }
        .btn { background: var(--btn-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); color: var(--text); padding: 20px 10px; border-radius: 12px; cursor: pointer; font-size: 15px; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn:hover { background: var(--btn-hover); transform: translateY(-5px) scale(1.05); border-color: #4CAF50; box-shadow: 0 10px 15px rgba(0,0,0,0.2); }
        .btn span { font-size: 28px; margin-bottom: 10px; }
        .btn-exe { background: var(--accent); border-color: var(--accent); color: white; grid-column: span 2; font-weight: bold; flex-direction: row; }
        .btn-exe:hover { background: #005A9E; }
        .btn-exe span { margin-bottom: 0; margin-right: 10px; font-size: 22px; }

        .dock { background: var(--glass-bg); backdrop-filter: blur(15px); padding: 12px; display: flex; justify-content: center; gap: 20px; border-top: 1px solid var(--glass-border); z-index: 100; }
        .dock-icon { font-size: 26px; cursor: pointer; transition: 0.2s; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--btn-bg); }
        .dock-icon:hover { transform: scale(1.15) translateY(-5px); background: var(--btn-hover); }

        .window { display: none; position: absolute; z-index: 10; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 380px; background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); animation: openAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); color: var(--text); resize: both; overflow: auto; }
        @keyframes openAnim { from { opacity: 0; transform: translate(-50%, -40%) scale(0.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        
        .window-header { background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; cursor: grab; border-bottom: 1px solid var(--glass-border); }
        .window-header:active { cursor: grabbing; }
        .window-title { font-weight: bold; color: #4CAF50; font-size: 16px; }
        .window-controls { display: flex; gap: 8px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
        .win-close { background: #ff5f56; } .win-close:hover { background: #ff3b30; }
        .win-max { background: #ffbd2e; } .win-max:hover { background: #ffcc00; }
        .window-body { padding: 20px; text-align: center; font-size: 15px; }

        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .calc-btn { padding: 15px; font-size: 18px; background: var(--btn-bg); border: 1px solid var(--glass-border); color: var(--text); border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .calc-btn:hover { background: var(--btn-hover); }
        .calc-btn.op { color: #4CAF50; font-weight: bold; } .calc-btn.eq { background: #4CAF50; color: white; }
        .display { width: 100%; height: 50px; background: rgba(0,0,0,0.3); color: var(--text); border: 1px solid var(--glass-border); font-size: 24px; text-align: right; padding: 5px 10px; box-sizing: border-box; border-radius: 8px; }
        .signature { color: var(--accent); font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--glass-border); letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="taskbar">
        <div class="taskbar-left">🪟 Win-Emulator OS</div>
        <div class="taskbar-right">
            <span id="live-time">00:00</span> | <span id="live-date">2026-11-24</span>
        </div>
    </div>

    <div class="desktop">
        <div class="menu">
            <button class="btn" onclick="openWindow('Date & Time', 'Current System Time:<br><br><b>' + new Date().toLocaleString() + '</b>')"><span>⏰</span> Date & Time</button>
            <button class="btn" onclick="openZapia()"><span>🔄</span> Zapia Transfer</button>
            <button class="btn" onclick="openSettings()"><span>⚙️</span> Settings</button>
            <button class="btn" onclick="openCalculator()"><span>🧮</span> Calculator</button>
            <button class="btn btn-exe" onclick="openEXE()"><span>🚀</span> Run Windows App (EXE)</button>
            <button class="btn" onclick="openWindow('System Shutdown', 'Goodbye! You can close the browser tab now.')"><span>❌</span> Exit</button>
        </div>
    </div>

    <div class="dock">
        <div class="dock-icon" onclick="openFileExplorer()">📁</div>
        <div class="dock-icon" onclick="openNotepad()">📝</div>
        <div class="dock-icon" onclick="openMusicPlayer()">🎵</div>
    </div>

    <div id="myWindow" class="window">
        <div class="window-header" id="windowHeader">
            <div class="window-title" id="windowTitle">App Title</div>
            <div class="window-controls">
                <button class="win-btn win-close" onclick="closeWindow()"></button>
                <button class="win-btn win-max" onclick="toggleFullScreen()"></button>
            </div>
        </div>
        <div class="window-body" id="windowBody"></div>
    </div>

    <script>
        // --- Live Clock ---
        function updateTime() {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('live-date').innerText = now.toLocaleDateString();
        }
        setInterval(updateTime, 1000); updateTime();

        // --- Window Management ---
        function openWindow(title, contentHtml) {
            document.getElementById('windowTitle').innerText = title;
            document.getElementById('windowBody').innerHTML = contentHtml;
            const win = document.getElementById('myWindow');
            win.style.display = "block";
            win.style.width = "90%"; win.style.height = "auto";
            win.style.left = "50%"; win.style.top = "50%"; win.style.transform = "translate(-50%, -50%)";
        }

        function closeWindow() {
            const win = document.getElementById('myWindow');
            win.style.display = "none";
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        function toggleFullScreen() {
            const win = document.getElementById('myWindow');
            if (!document.fullscreenElement) {
                win.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // --- Draggable Logic ---
        dragElement(document.getElementById("myWindow"));
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = document.getElementById("windowHeader");
            if (header) { header.onmousedown = dragMouseDown; } else { elmnt.onmousedown = dragMouseDown; }

            function dragMouseDown(e) {
                e = e || window.event; e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event; e.preventDefault();
                pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                pos3 = e.clientX; pos4 = e.clientY;
                let currentTop = parseInt(elmnt.style.top) || 0;
                let currentLeft = parseInt(elmnt.style.left) || 0;
                
                if(elmnt.style.transform.includes("translate")) {
                    elmnt.style.transform = "none";
                    elmnt.style.top = (window.innerHeight / 2 - elmnt.offsetHeight / 2) + "px";
                    elmnt.style.left = (window.innerWidth / 2 - elmnt.offsetWidth / 2) + "px";
                    currentTop = parseInt(elmnt.style.top);
                    currentLeft = parseInt(elmnt.style.left);
                }

                elmnt.style.top = (currentTop - pos2) + "px";
                elmnt.style.left = (currentLeft - pos1) + "px";
            }

            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
        }

        // --- Apps ---
        function openSettings() {
            let isLight = document.body.classList.contains('light-mode');
            openWindow("⚙️ Settings", `
                <p>Theme: <b>${isLight ? 'Light' : 'Dark'}</b></p>
                <button class="btn" style="width:100%; margin-top:15px;" onclick="toggleTheme()"><span>${isLight ? '🌙' : '☀️'}</span> Change Theme</button>
                <button class="btn" style="width:100%; margin-top:10px; background:#0078D7; color:white;" onclick="installApp()"><span>📲</span> Install on Home Screen</button>
            `);
        }
        function toggleTheme() { document.body.classList.toggle('light-mode'); openSettings(); }
        function installApp() { alert("For installing, use your browser menu (Three dots) and select 'Add to Home screen'."); }

        function openFileExplorer() {
            openWindow("📁 File Explorer", `
                <div style="text-align:left; background:rgba(0,0,0,0.2); padding:10px; border-radius:8px;">
                    <div style="padding:10px; border-bottom:1px solid var(--glass-border);">📁 Program Files</div>
                    <div style="padding:10px; border-bottom:1px solid var(--glass-border);">📁 Windows</div>
                    <div style="padding:10px; border-bottom:1px solid var(--glass-border);">📄 readme.txt</div>
                    <div style="padding:10px; color:#4CAF50;">📄 Zapia_Download.zip</div>
                </div>
            `);
        }

        let calcExp = "";
        function openCalculator() {
            calcExp = "";
            openWindow("🧮 Calculator", `
                <div class="signature">👨‍💻 فردین نبی زاده</div>
                <input type="text" id="calcDisp" class="display" readonly>
                <div class="calc-grid">
                    <button class="calc-btn" onclick="cIn('7')">7</button><button class="calc-btn" onclick="cIn('8')">8</button><button class="calc-btn" onclick="cIn('9')">9</button><button class="calc-btn op" onclick="cIn('/')">/</button>
                    <button class="calc-btn" onclick="cIn('4')">4</button><button class="calc-btn" onclick="cIn('5')">5</button><button class="calc-btn" onclick="cIn('6')">6</button><button class="calc-btn op" onclick="cIn('*')">*</button>
                    <button class="calc-btn" onclick="cIn('1')">1</button><button class="calc-btn" onclick="cIn('2')">2</button><button class="calc-btn" onclick="cIn('3')">3</button><button class="calc-btn op" onclick="cIn('-')">-</button>
                    <button class="calc-btn" onclick="calcExp='';document.getElementById('calcDisp').value=''">C</button><button class="calc-btn" onclick="cIn('0')">0</button><button class="calc-btn eq" onclick="document.getElementById('calcDisp').value=eval(calcExp)">=</button><button class="calc-btn op" onclick="cIn('+')">+</button>
                </div>
            `);
        }
        function cIn(v) { calcExp += v; document.getElementById('calcDisp').value = calcExp; }

        function openNotepad() {
            let saved = localStorage.getItem('note') || "";
            openWindow("📝 Notepad", `
                <textarea id="noteArea" style="width:100%; height:150px; background:rgba(0,0,0,0.2); color:var(--text); border:1px solid var(--glass-border); border-radius:8px; padding:10px; font-family:monospace;">${saved}</textarea>
                <button class="btn" style="width:100%; margin-top:10px; background:#4CAF50; color:white;" onclick="saveNote()">💾 Save Note</button>
            `);
        }
        function saveNote() { localStorage.setItem('note', document.getElementById('noteArea').value); alert("Saved!"); }

        function openMusicPlayer() {
            openWindow("🎵 Music Player", `
                <input type="file" id="audioInput" accept="audio/*" style="display:none;" onchange="loadAudio()"/>
                <button class="btn" style="width:100%; background:#4CAF50; color:white;" onclick="document.getElementById('audioInput').click()"><span>📂</span> Load Audio</button>
                <p id="audioName" style="margin-top:10px; font-size:12px;"></p>
                <audio id="audioPlayer" controls style="width:100%; margin-top:10px; display:none;"></audio>
            `);
        }
        function loadAudio() {
            let file = document.getElementById('audioInput').files[0];
            if(!file) return;
            let audio = document.getElementById('audioPlayer');
            audio.src = URL.createObjectURL(file);
            audio.style.display = "block"; audio.play();
            document.getElementById('audioName').innerText = file.name;
        }

        function openZapia() {
            openWindow("🔄 Zapia Transfer", `
                <input type="file" id="zapiaInput" style="display:none;" onchange="zapiaProg()"/>
                <button class="btn" style="width:100%; background:#4CAF50; color:white;" onclick="document.getElementById('zapiaInput').click()"><span>📂</span> Select File</button>
                <p id="zapiaTxt" style="margin-top:10px; font-size:12px;"></p>
                <div style="background:#333; height:8px; border-radius:4px; margin-top:10px; overflow:hidden; display:none;" id="zapiaBarCont"><div style="background:#4CAF50; height:100%; width:0%;" id="zapiaBar"></div></div>
            `);
        }
        function zapiaProg() {
            let f = document.getElementById('zapiaInput').files[0];
            if(!f) return;
            document.getElementById('zapiaTxt').innerText = "Transferring: " + f.name;
            document.getElementById('zapiaBarCont').style.display = "block";
            let p=0, b=document.getElementById('zapiaBar');
            let i = setInterval(()=>{ p+=10; b.style.width=p+"%"; if(p>=100){clearInterval(i);document.getElementById('zapiaTxt').innerText="✅ Transfer Done!";} }, 200);
        }

        function openEXE() {
            openWindow("🚀 Run EXE", `
                <input type="file" id="exeInput" accept=".exe" style="display:none;" onchange="exeLoad()"/>
                <button class="btn" style="width:100%; background:#0078D7; color:white;" onclick="document.getElementById('exeInput').click()"><span>📂</span> Select .EXE</button>
                <p id="exeTxt" style="margin-top:10px; font-size:12px;"></p>
            `);
        }
        function exeLoad() {
            let f = document.getElementById('exeInput').files[0];
            if(!f) return;
            document.getElementById('exeTxt').innerText = "Loading " + f.name + "... (Simulating)";
        }

        document.getElementById('myWindow').onclick = function(e) { e.stopPropagation(); };
    </script>
</body>
</html>
