<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0078D7"><title>Windows-Emulator</title><style>:root{--bg:#1a1a1a;--text:#fff;--panel:#2d2d2d;--border:#444}body.light{--bg:#f0f0f0;--text:#000;--panel:#ddd;--border:#bbb}body{font-family:sans-serif;background:var(--bg);color:var(--text);margin:0;display:flex;flex-direction:column;height:100vh}.taskbar{background:var(--panel);padding:10px 20px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}.desktop{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px;max-width:400px;margin:0 auto;align-content:center}.btn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:20px;border-radius:12px;cursor:pointer;font-size:14px;display:flex;flex-direction:column;align-items:center}.btn span{font-size:24px;margin-bottom:8px}.exe{grid-column:span 2;background:#0078D7;color:white}.dock{background:var(--panel);padding:15px;display:flex;justify-content:center;gap:20px;border-top:1px solid var(--border);font-size:24px}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7)}.content{background:var(--panel);margin:20% auto;padding:20px;border-radius:12px;width:80%;max-width:320px;text-align:center;position:relative}.close{position:absolute;right:15px;top:10px;font-size:24px;cursor:pointer}.sig{color:#0078D7;font-weight:bold;margin-bottom:15px;border-bottom:1px solid var(--border);padding-bottom:10px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.calc-btn{padding:15px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:5px;cursor:pointer}.display{width:100%;height:40px;margin-bottom:10px;text-align:right;font-size:20px;background:var(--bg);color:var(--text);border:1px solid var(--border)}</style></head><body><div class="taskbar"><b>🪟 Win-Emulator</b><span id="clock"></span></div><div class="desktop"><button class="btn" onclick="show('Date','Today is: '+new Date().toLocaleString())"><span>⏰</span>Date</button><button class="btn" onclick="show('Bluetooth','Scanning...')"><span>🔵</span>Bluetooth</button><button class="btn" onclick="show('Wi-Fi','Connected to Home-WiFi')"><span>📶</span>Wi-Fi</button><button class="btn" onclick="zapia()"><span>🔄</span>Zapia</button><button class="btn" onclick="settings()"><span>⚙️</span>Settings</button><button class="btn exe" onclick="show('EXE','Select an EXE file to run.')"><span>🚀</span>Run Windows App</button></div><div class="dock"><span onclick="explorer()">📁</span><span onclick="calc()">🧮</span><span onclick="music()">🎵</span></div><div id="modal" class="modal"><div class="content"><span class="close" onclick="document.getElementById('modal').style.display='none'">&times;</span><div id="title" style="color:#4CAF50;font-size:20px;margin-bottom:15px"></div><div id="body"></div></div></div><script>setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},1000);function show(t,b){document.getElementById('title').innerText=t;document.getElementById('body').innerHTML=b;document.getElementById('modal').style.display='block'}function settings(){show('Settings','<button onclick="document.body.classList.toggle(\'light\')">Toggle Theme</button>')}function explorer(){show('File Explorer','<div style="text-align:left;background:#111;padding:10px">📁 Program Files<br>📁 Windows<br>📄 readme.txt</div>')}let exp='';function calc(){show('Calculator','<div class="sig">👨‍💻 فردین نبی زاده</div><input id="d" class="display" readonly><div class="calc-grid"><button class="calc-btn" onclick="calc(1)">1</button><button class="calc-btn" onclick="calc(2)">2</button><button class="calc-btn" onclick="calc(3)">3</button><button class="calc-btn" onclick="calc(\'+\')">+</button><button class="calc-btn" onclick="calc(4)">4</button><button class="calc-btn" onclick="calc(5)">5</button><button class="calc-btn" onclick="calc(6)">6</button><button class="calc-btn" onclick="calc(\'-\')">-</button><button class="calc-btn" onclick="calc(7)">7</button><button class="calc-btn" onclick="calc(8)">8</button><button class="calc-btn" onclick="calc(9)">9</button><button class="calc-btn" onclick="calc(\'*\')">*</button><button class="calc-btn" onclick="exp=\'\'">C</button><button class="calc-btn" onclick="calc(0)">0</button><button class="calc-btn" onclick="document.getElementById(\'d\').value=eval(exp)">=</button><button class="calc-btn" onclick="calc(\'/\')">/</button></div>')}function calc(v){exp+=v;document.getElementById('d').value=exp}function music(){show('Music','<audio controls style="width:100%"><source src="" type="audio/mpeg"></audio><p>Select a local file in a real app.</p>')}function zapia(){show('Zapia','<input type="file"><br><br><progress value="100" max="100"></progress>')}</script></body></html>
